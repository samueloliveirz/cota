<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <style th:replace="~{pdf/base :: estilo}"></style>
</head>
<body>

<div class="via" th:each="via : ${ {'Via do cliente', 'Via da loja'} }">
    <div class="nome-via" th:text="${via}">Via do cliente</div>

    <table th:replace="~{pdf/base :: cabecalho('Contas a receber', ${orcamento.id})}"></table>

    <table class="resumo">
        <tr>
            <td style="width: 17%;">
                <div class="rotulo">Emissão</div>
                <div class="valor" th:text="${#temporals.format(orcamento.dataCriacao, 'dd/MM/yyyy')}">01/01/2026</div>
            </td>
            <td style="width: 25%;">
                <div class="rotulo">Pagamento</div>
                <div class="valor">PIX (CNPJ)</div>
            </td>
            <td>
                <div class="rotulo">Chave PIX</div>
                <div class="pix-chave" th:text="${loja.pix}">00.000.000/0001-00</div>
            </td>
        </tr>
    </table>

    <div th:replace="~{pdf/base :: cliente(${orcamento}, 'Empresa')}"></div>
    <div th:replace="~{pdf/base :: itens(${orcamento})}"></div>

    <table class="fim">
        <tr>
            <td style="width: 58%; padding-right: 3px;">
                <div class="bloco" th:if="${orcamento.observacao != null}">
                    <div class="bloco-titulo">Observações</div>
                    <div class="bloco-corpo quebra" th:text="${orcamento.observacao}">Observação</div>
                </div>
            </td>
            <td>
                <div th:replace="~{pdf/base :: totais(${orcamento})}"></div>
            </td>
        </tr>
    </table>

    <div th:replace="~{pdf/base :: rodape(${loja.nome}, 'Recebido por (cliente)')}"></div>
</div>

</body>
</html>
