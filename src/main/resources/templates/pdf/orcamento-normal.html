<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <style th:replace="~{pdf/base :: estilo}"></style>
</head>
<body>

<div class="via" th:each="via : ${ {'Via do cliente', 'Via da loja'} }">
    <div class="nome-via" th:text="${via}">Via do cliente</div>

    <table th:replace="~{pdf/base :: cabecalho('Orçamento', ${orcamento.id})}"></table>
    <table th:replace="~{pdf/base :: resumo(${orcamento})}"></table>
    <div th:replace="~{pdf/base :: cliente(${orcamento}, 'Empresa')}"></div>
    <div th:replace="~{pdf/base :: itens(${orcamento})}"></div>

    <table class="fim">
        <tr>
            <td style="width: 58%; padding-right: 3px;">
                <div th:replace="~{pdf/base :: observacoes(${orcamento})}"></div>
            </td>
            <td>
                <div th:replace="~{pdf/base :: totais(${orcamento})}"></div>
            </td>
        </tr>
    </table>

    <div th:replace="~{pdf/base :: rodape(${loja.nome}, 'Cliente')}"></div>
</div>

</body>
</html>
