<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <style th:replace="~{pdf/base :: estilo}"></style>
</head>
<body>

<div class="via" th:each="via : ${ {'Via do cliente', 'Via da loja'} }">
    <div class="nome-via" th:text="${via}">Via do cliente</div>

    <table th:replace="~{pdf/base :: cabecalho('Ordem de manutenção', ${ordem.id})}"></table>

    <table class="resumo">
        <tr>
            <td style="width: 17%;">
                <div class="rotulo">Entrada</div>
                <div class="valor" th:text="${#temporals.format(ordem.dataCriacao, 'dd/MM/yyyy')}">01/01/2026</div>
            </td>
            <td style="width: 25%;">
                <div class="rotulo">Setor</div>
                <div class="valor" th:text="${ordem.setor.name() == 'PNEUMATICA'} ? 'Pneumática' : 'Hidráulica'">Hidráulica</div>
            </td>
            <td>
                <div class="rotulo">Equipamentos</div>
                <div class="valor" th:text="${#lists.size(ordem.itens)} + (${#lists.size(ordem.itens) == 1} ? ' item' : ' itens')">1 item</div>
            </td>
        </tr>
    </table>

    <div class="bloco">
        <div class="bloco-titulo">Cliente</div>
            <table class="campos">
                <tr>
                    <td style="width: 60%;">
                        <div class="rotulo">Empresa</div>
                        <div class="valor forte" th:text="${ordem.empresa}">Empresa</div>
                    </td>
                    <td>
                        <div class="rotulo">Telefone</div>
                        <div class="valor" th:text="${ordem.telefone ?: '—'}">Telefone</div>
                    </td>
                </tr>
                <tr th:if="${ordem.comprador != null or ordem.email != null}">
                    <td>
                        <th:block th:if="${ordem.comprador != null}">
                            <div class="rotulo">Responsável</div>
                            <div th:text="${ordem.comprador}">Comprador</div>
                        </th:block>
                    </td>
                    <td>
                        <th:block th:if="${ordem.email != null}">
                            <div class="rotulo">E-mail</div>
                            <div th:text="${ordem.email}">E-mail</div>
                        </th:block>
                    </td>
                </tr>
            </table>
    </div>

    <div class="bloco">
        <div class="bloco-titulo">Equipamentos</div>
        <table class="itens">
            <tr>
                <th class="num">Item</th>
                <th>Equipamento</th>
                <th style="width: 140px;">Código</th>
                <th class="direita" style="width: 40px;">Qtd</th>
            </tr>
            <tr th:each="item, i : ${ordem.itens}" th:class="${(i.even ? 'par ' : '') + (i.last ? 'ultima' : '')}">
                <td class="num" th:text="${i.count}">1</td>
                <td th:text="${item.produto.nome}">Cilindro</td>
                <td th:text="${item.codigo ?: '—'}">Código</td>
                <td class="direita" th:text="${item.quantidade}">1</td>
            </tr>
        </table>
    </div>

    <div class="bloco">
        <div class="bloco-titulo">Problema relatado</div>
        <div class="bloco-corpo problema quebra" th:text="${ordem.problemaRelatado}">Problema</div>
    </div>

    <div class="bloco" th:if="${ordem.observacao != null}">
        <div class="bloco-titulo">Observações</div>
        <div class="bloco-corpo quebra" th:text="${ordem.observacao}">Observação</div>
    </div>

    <div th:replace="~{pdf/base :: rodape('Cliente (entregou o equipamento)', 'Responsável técnico')}"></div>
</div>

</body>
</html>
