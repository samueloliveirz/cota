<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <style th:replace="~{pdf/base :: estilo}"></style>
    <style>
        /* A proposta tem uma via só, então usa a folha com mais respiro que os modelos de duas vias */
        body { font-size: 9.5px; }
        .resumo, .bloco, .fim, .totais-bloco { margin-top: 12px; }
        .cabecalho td { padding: 8px 10px; }
        .resumo td, .campos td { padding: 6px 8px; }
        .bloco-titulo { padding: 4px 8px; }
        .bloco-corpo { padding: 8px; line-height: 1.5; }
        .itens th { padding: 5px 8px; }
        .itens td { padding: 6px 8px; }
        .totais td { padding: 5px 8px; }
        .totais tr.total td { padding: 7px 8px; font-size: 12px; }
        .totais-bloco { width: 45%; margin-left: 55%; }
        .rodape { margin-top: 60px; }
    </style>
</head>
<body>

<div>
    <table th:replace="~{pdf/base :: cabecalho('Proposta comercial', ${orcamento.id})}"></table>
    <table th:replace="~{pdf/base :: resumo(${orcamento})}"></table>
    <div th:replace="~{pdf/base :: cliente(${orcamento}, 'Empresa')}"></div>
    <div th:replace="~{pdf/base :: itens(${orcamento})}"></div>

    <!-- Totais à direita, observações embaixo em largura total e depois as assinaturas.
         Os três ficam juntos se precisar quebrar a página. -->
    <div style="page-break-inside: avoid;">
        <div class="totais-bloco">
            <div th:replace="~{pdf/base :: totais(${orcamento})}"></div>
        </div>

        <div class="bloco">
            <div th:replace="~{pdf/base :: observacoes(${orcamento})}"></div>
        </div>

        <div th:replace="~{pdf/base :: rodape(${loja.nome}, 'De acordo — cliente (nome, data e carimbo)')}"></div>
    </div>
</div>

</body>
</html>
