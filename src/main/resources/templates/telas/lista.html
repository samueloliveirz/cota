<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cota | Orçamentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cota.css}">
    <style>
        .abas { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #E4E7EC; }
        .aba { padding: 10px 12px; font-size: 14px; font-weight: 500; color: #5B6474; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .aba:hover { color: #0E1726; }
        .aba.ativa { color: #0E1726; border-bottom-color: #0E1726; }
        .aba .qtd { margin-left: 6px; padding: 1px 7px; border-radius: 10px; background: #F2F4F7; font-size: 12px; color: #344054; }

        .empresa { font-weight: 500; }
        .cnpj { display: block; font-size: 12px; color: #5B6474; margin-top: 2px; }
        .vencido { color: #B42318; }

        .status { padding: 4px 8px; border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid; }
        .status.enviado { background: #EEF4FF; color: #2E4BB0; border-color: #C7D7FE; }
        .status.aguardado { background: #FFF6E8; color: #93460B; border-color: #F6D9AE; }
        .status.fechado { background: #ECFDF3; color: #067647; border-color: #ABEFC6; }
        .status.nao_fechado { background: #FEF3F2; color: #B42318; border-color: #FECDCA; }

        .acoes { display: flex; justify-content: flex-end; gap: 4px; }
        .icone.bloqueado { opacity: 0.35; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app" th:with="admin=${usuarioLogado.role.name() == 'ADMIN'}">
    <aside th:replace="~{fragments/sidebar :: sidebar('orcamentos')}"></aside>

    <main class="conteudo">
        <div class="topo">
            <div>
                <h1>Orçamentos</h1>
                <p class="subtitulo" th:text="${admin} ? 'Todos os setores.' : 'Orçamentos do seu setor.'">Orçamentos do seu setor.</p>
            </div>
            <a class="btn btn-primario" th:href="@{/painel/orcamentos/novo}">+ Novo orçamento</a>
        </div>

        <form method="get" th:action="@{/painel/orcamentos}">
            <input type="hidden" name="status" th:value="${statusAtual}">
            <label class="busca">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6474" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <input type="search" name="empresa" th:value="${empresa}" placeholder="Buscar por empresa">
            </label>
        </form>

        <nav class="abas">
            <a class="aba" th:href="@{/painel/orcamentos(empresa=${empresa})}"
               th:classappend="${statusAtual == null} ? 'ativa'">
                Todos<span class="qtd" th:text="${contagem['TODOS']}">0</span>
            </a>
            <a class="aba" th:each="s : ${statusList}"
               th:href="@{/painel/orcamentos(status=${s}, empresa=${empresa})}"
               th:classappend="${statusAtual == s} ? 'ativa'">
                <span th:text="${s.nome}">Enviado</span><span class="qtd" th:text="${contagem[s.name()]}">0</span>
            </a>
        </nav>

        <div class="card tabela-card">
            <div class="tabela-scroll">
                <table class="tabela">
                    <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Empresa</th>
                        <th>Tipo</th>
                        <th th:if="${admin}">Setor</th>
                        <th class="direita">Total</th>
                        <th>Status</th>
                        <th>Criado em</th>
                        <th>Válido até</th>
                        <th class="direita">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="o : ${orcamentos.content}">
                        <td class="mono" th:text="'#' + ${o.id}">#1</td>
                        <td>
                            <span class="empresa" th:text="${o.empresa}">Empresa</span>
                            <span class="cnpj"
                                  th:text="${o.cnpj != null} ? ${o.cnpj.replaceAll('(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})', '$1.$2.$3/$4-$5')} : 'Sem CNPJ (presencial)'">CNPJ</span>
                        </td>
                        <td><span class="tag" th:text="${#strings.capitalize(#strings.toLowerCase(o.tipo.name()))}">Normal</span></td>
                        <td th:if="${admin}">
                            <span class="setor">
                                <span class="dot" th:classappend="${#strings.toLowerCase(o.setor.name())}"></span>
                                <span th:text="${o.setor.name() == 'PNEUMATICA'} ? 'Pneumática' : 'Hidráulica'">Hidráulica</span>
                            </span>
                        </td>
                        <td class="direita" th:text="'R$ ' + ${#numbers.formatDecimal(o.total, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                        <td>
                            <form method="post" th:action="@{/painel/orcamentos/{id}/status(id=${o.id})}">
                                <select name="status" class="status"
                                        th:classappend="${#strings.toLowerCase(o.status.name())}"
                                        onchange="this.form.submit()">
                                    <option th:each="s : ${statusList}"
                                            th:value="${s}"
                                            th:text="${s.nome}"
                                            th:selected="${s == o.status}">Enviado</option>
                                </select>
                            </form>
                        </td>
                        <td class="data" th:text="${#temporals.format(o.dataCriacao, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td class="data"
                            th:classappend="${o.dataValidade.isBefore(#temporals.createToday())} ? 'vencido'"
                            th:text="${#temporals.format(o.dataValidade, 'dd/MM/yyyy')}">21/01/2026</td>
                        <td>
                            <div class="acoes">
                                <a class="icone" th:href="@{/orcamentos/{id}/pdf(id=${o.id})}" target="_blank" title="Abrir PDF">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3"></path></svg>
                                </a>
                                <a class="icone" th:if="${o.status.name() != 'FECHADO'}"
                                   th:href="@{/painel/orcamentos/{id}/editar(id=${o.id})}" title="Editar">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
                                </a>
                                <span class="icone bloqueado" th:if="${o.status.name() == 'FECHADO'}" title="Orçamento fechado não pode ser editado">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                                </span>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${orcamentos.isEmpty()}">
                        <td colspan="9" class="vazio">Nenhum orçamento encontrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="rodape" th:if="${orcamentos.totalElements > 0}">
                <span th:text="'Mostrando ' + ${orcamentos.numberOfElements} + ' de ' + ${orcamentos.totalElements}">Mostrando 10 de 12</span>
                <div class="paginas">
                    <a class="btn btn-secundario" th:if="${orcamentos.hasPrevious()}"
                       th:href="@{/painel/orcamentos(empresa=${empresa}, status=${statusAtual}, pagina=${orcamentos.number - 1})}">‹ Anterior</a>
                    <a class="btn btn-secundario" th:if="${orcamentos.hasNext()}"
                       th:href="@{/painel/orcamentos(empresa=${empresa}, status=${statusAtual}, pagina=${orcamentos.number + 1})}">Próxima ›</a>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
