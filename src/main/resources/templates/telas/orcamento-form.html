<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cota | Novo orçamento</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f5f7; color: #222; }
    header { background: #1f2937; color: #fff; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 22px; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .card h3 { margin-top: 0; }
    .linha { display: flex; gap: 16px; }
    .campo { flex: 1; margin-bottom: 14px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    textarea { height: 60px; resize: vertical; }
    .escondido { display: none; }
    .itens { width: 100%; border-collapse: collapse; }
    .itens th { text-align: left; font-size: 13px; padding: 6px; }
    .itens td { padding: 4px 6px; }
    .direita { text-align: right; }
    .totais { text-align: right; margin-top: 12px; font-size: 15px; }
    .totais div { margin: 4px 0; }
    .total-geral { font-weight: bold; font-size: 18px; }
    .erros { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .botoes { display: flex; gap: 10px; }
    .botao { padding: 10px 18px; background: #1f2937; color: #fff; border: none; border-radius: 6px;
      font-size: 14px; cursor: pointer; text-decoration: none; }
    .botao.secundario { background: #6b7280; }
    .remover { background: #fee2e2; color: #991b1b; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>Cota</h1>
</header>

<main>
  <h2>Novo orçamento</h2>

  <div id="erros" class="erros escondido"></div>

  <form id="formulario">

    <div class="card">
      <h3>Cliente</h3>
      <div class="linha">
        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo">
            <option value="FORMALIZADO">Formalizado</option>
            <option value="NORMAL">Normal</option>
            <option value="PRESENCIAL">Presencial</option>
            <option value="VALE">Vale (contas a receber)</option>
          </select>
        </div>
        <div class="campo">
          <label for="empresa">Empresa / cliente</label>
          <input id="empresa" required>
        </div>
        <div class="campo">
          <label for="cnpj">CNPJ</label>
          <input id="cnpj" placeholder="Opcional no presencial">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Entrega e pagamento</h3>
      <div class="linha">
        <div class="campo">
          <label for="tipoRetirada">Retirada</label>
          <select id="tipoRetirada">
            <option value="LOJA">Retirada na loja</option>
            <option value="SEDEX">Sedex</option>
          </select>
        </div>
        <div class="campo">
          <label for="formaPagamento">Pagamento</label>
          <select id="formaPagamento">
            <option value="A_VISTA">À vista</option>
            <option value="FATURADO">Faturado</option>
          </select>
        </div>
        <div class="campo escondido" id="campoDias">
          <label for="diasFaturamento">Dias de faturamento</label>
          <input id="diasFaturamento" type="number" min="1">
        </div>
        <div class="campo">
          <label for="frete">Frete (R$)</label>
          <input id="frete" type="number" min="0" step="0.01" value="0">
        </div>
      </div>
      <div class="campo escondido" id="campoEndereco">
        <label for="enderecoEnvio">Endereço de envio</label>
        <input id="enderecoEnvio">
      </div>
    </div>

    <div class="card">
      <h3>Itens</h3>
      <table class="itens">
        <thead>
        <tr>
          <th style="width: 40%">Produto</th>
          <th>Código</th>
          <th style="width: 90px">Qtd</th>
          <th style="width: 130px">Preço unit.</th>
          <th class="direita" style="width: 110px">Total</th>
          <th style="width: 50px"></th>
        </tr>
        </thead>
        <tbody id="itens"></tbody>
      </table>

      <button type="button" class="botao secundario" id="adicionar" style="margin-top: 10px;">+ Adicionar item</button>

      <div class="totais">
        <div>Subtotal: R$ <span id="subtotal">0,00</span></div>
        <div>Frete: R$ <span id="valorFrete">0,00</span></div>
        <div class="total-geral">Total: R$ <span id="total">0,00</span></div>
      </div>
    </div>

    <div class="card">
      <div class="campo">
        <label for="observacao">Observação</label>
        <textarea id="observacao"></textarea>
      </div>
      <div class="botoes">
        <button type="submit" class="botao">Gerar PDF</button>
        <a class="botao secundario" th:href="@{/painel}">Voltar</a>
      </div>
    </div>
  </form>
</main>

<script>
  const tabela = document.getElementById('itens');

  function formatar(valor) {
    return valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function texto(id) {
    const valor = document.getElementById(id).value.trim();
    return valor === '' ? null : valor;
  }

  function numero(id) {
    const valor = document.getElementById(id).value;
    return valor === '' ? null : Number(valor);
  }

  function adicionarItem() {
    const linha = document.createElement('tr');
    linha.innerHTML = `
            <td><input class="produto" required></td>
            <td><input class="codigo"></td>
            <td><input class="quantidade" type="number" min="1" value="1" required></td>
            <td><input class="preco" type="number" min="0.01" step="0.01" required></td>
            <td class="direita total-item">0,00</td>
            <td><button type="button" class="remover">✕</button></td>
        `;
    tabela.appendChild(linha);
  }

  function recalcular() {
    let subtotal = 0;

    tabela.querySelectorAll('tr').forEach(linha => {
      const quantidade = Number(linha.querySelector('.quantidade').value) || 0;
      const preco = Number(linha.querySelector('.preco').value) || 0;
      const totalItem = quantidade * preco;
      linha.querySelector('.total-item').textContent = formatar(totalItem);
      subtotal += totalItem;
    });

    const frete = numero('frete') || 0;
    document.getElementById('subtotal').textContent = formatar(subtotal);
    document.getElementById('valorFrete').textContent = formatar(frete);
    document.getElementById('total').textContent = formatar(subtotal + frete);
  }

  function atualizarCamposExtras() {
    const sedex = document.getElementById('tipoRetirada').value === 'SEDEX';
    const faturado = document.getElementById('formaPagamento').value === 'FATURADO';
    document.getElementById('campoEndereco').classList.toggle('escondido', !sedex);
    document.getElementById('campoDias').classList.toggle('escondido', !faturado);
  }

  function montarOrcamento() {
    const itens = [...tabela.querySelectorAll('tr')].map(linha => ({
      produto: linha.querySelector('.produto').value.trim(),
      codigo: linha.querySelector('.codigo').value.trim() || null,
      quantidade: Number(linha.querySelector('.quantidade').value),
      precoUnitario: Number(linha.querySelector('.preco').value)
    }));

    return {
      tipo: texto('tipo'),
      empresa: texto('empresa'),
      cnpj: texto('cnpj'),
      tipoRetirada: texto('tipoRetirada'),
      enderecoEnvio: texto('enderecoEnvio'),
      formaPagamento: texto('formaPagamento'),
      diasFaturamento: numero('diasFaturamento'),
      frete: numero('frete'),
      observacao: texto('observacao'),
      itens: itens
    };
  }

  function mostrarErros(resposta) {
    const mensagens = resposta.campos ? Object.values(resposta.campos) : [resposta.mensagem];
    const caixa = document.getElementById('erros');
    caixa.innerHTML = [...new Set(mensagens)].map(m => `<div>${m}</div>`).join('');
    caixa.classList.remove('escondido');
    window.scrollTo(0, 0);
  }

  async function enviar(evento) {
    evento.preventDefault();

    const resposta = await fetch('/orcamentos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(montarOrcamento())
    });

    const corpo = await resposta.json();

    if (resposta.ok) {
      window.location.href = `/orcamentos/${corpo.id}/pdf`;
    } else {
      mostrarErros(corpo);
    }
  }

  tabela.addEventListener('input', recalcular);
  tabela.addEventListener('click', evento => {
    if (evento.target.classList.contains('remover')) {
      evento.target.closest('tr').remove();
      recalcular();
    }
  });
  document.getElementById('adicionar').addEventListener('click', adicionarItem);
  document.getElementById('frete').addEventListener('input', recalcular);
  document.getElementById('tipoRetirada').addEventListener('change', atualizarCamposExtras);
  document.getElementById('formaPagamento').addEventListener('change', atualizarCamposExtras);
  document.getElementById('formulario').addEventListener('submit', enviar);

  adicionarItem();
</script>

</body>
</html>
