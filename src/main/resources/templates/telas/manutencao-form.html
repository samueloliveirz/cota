<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cota | Nova manutenção</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cota.css}">
    <style>
        .escondido { display: none !important; }
        .migalha { font-size: 13px; color: #5B6474; }
        .migalha a { color: #5B6474; text-decoration: none; }
        .migalha a:hover { color: #0E1726; }

        .formulario { max-width: 880px; display: flex; flex-direction: column; gap: 20px; }
        .card h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
        .linha { display: flex; flex-wrap: wrap; gap: 16px; }
        .linha .campo { flex: 1 1 220px; }
        .linha + .linha { margin-top: 16px; }
        .bloco + .bloco { margin-top: 16px; }
        .opcional { font-weight: 400; color: #5B6474; }
        .lbl-linha { display: flex; justify-content: space-between; }
        .contador { font-size: 12px; color: #5B6474; font-variant-numeric: tabular-nums; }

        .itens-scroll { overflow-x: auto; }
        .itens { width: 100%; min-width: 520px; border-collapse: collapse; }
        .itens th { text-align: left; font-size: 12px; font-weight: 500; color: #5B6474; padding: 0 6px 8px; }
        .itens td { padding: 4px 6px; }
        .itens .in { height: 38px; width: 100%; }
        .itens select.in { background: #FFFFFF; }
        .mono { font-family: 'Geist Mono', monospace; }
        .remover { width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #5B6474; cursor: pointer; }
        .remover:hover { background: #FEF3F2; color: #B42318; }
        .remover:disabled { visibility: hidden; }

        .alerta-ok { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
        .alerta-ok a { color: #067647; font-weight: 600; }
        .acoes-form { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

<div class="app">
    <aside th:replace="~{fragments/sidebar :: sidebar('nova-manutencao')}"></aside>

    <main class="conteudo">
        <div>
            <div class="migalha">
                <a th:href="@{/painel/manutencoes}">Ordens de manutenção</a> / Nova
            </div>
            <h1 style="margin-top: 8px;">Nova ordem de manutenção</h1>
            <p class="subtitulo">Depois de salvar, é só abrir o PDF com as 2 vias.</p>
        </div>

        <div id="sucesso" class="alerta-ok formulario escondido"></div>
        <div id="erros" class="alerta-erro formulario escondido"></div>

        <div class="formulario" id="ficha">

            <section class="card">
                <h2>Cliente</h2>
                <div class="linha">
                    <div class="campo">
                        <label class="lbl" for="empresa">Empresa</label>
                        <input class="in" id="empresa" placeholder="Razão social ou nome">
                    </div>
                    <div class="campo">
                        <label class="lbl" for="comprador">Comprador <span class="opcional">(opcional)</span></label>
                        <input class="in" id="comprador" placeholder="Nome de quem trouxe">
                    </div>
                </div>
                <div class="linha">
                    <div class="campo">
                        <label class="lbl" for="telefone">Telefone</label>
                        <input class="in" id="telefone" type="tel" placeholder="(11) 90000-0000">
                    </div>
                    <div class="campo">
                        <label class="lbl" for="email">E-mail <span class="opcional">(opcional)</span></label>
                        <input class="in" id="email" type="email" placeholder="compras@empresa.com.br">
                    </div>
                </div>
            </section>

            <section class="card">
                <h2>Equipamentos</h2>
                <div class="itens-scroll">
                    <table class="itens">
                        <thead>
                        <tr>
                            <th style="width: 34%">Equipamento</th>
                            <th>Código <span class="opcional">(opcional)</span></th>
                            <th style="width: 90px">Qtd</th>
                            <th style="width: 44px"></th>
                        </tr>
                        </thead>
                        <tbody id="itens"></tbody>
                    </table>
                </div>
                <button type="button" class="btn btn-secundario" id="adicionar" style="margin-top: 12px">+ Adicionar equipamento</button>

                <template id="opcoesProduto">
                    <option th:each="p : ${produtos}" th:value="${p}" th:text="${p.nome}">Cilindro</option>
                </template>
            </section>

            <section class="card">
                <div class="campo bloco">
                    <div class="lbl-linha">
                        <label class="lbl" for="problemaRelatado">Problema relatado</label>
                        <span class="contador" data-de="problemaRelatado">0 / 1000</span>
                    </div>
                    <textarea class="in" id="problemaRelatado" rows="4" maxlength="1000"
                              placeholder="O que o cliente disse que está acontecendo"></textarea>
                </div>

                <div class="campo bloco">
                    <div class="lbl-linha">
                        <label class="lbl" for="observacao">Observação <span class="opcional">(opcional)</span></label>
                        <span class="contador" data-de="observacao">0 / 1000</span>
                    </div>
                    <textarea class="in" id="observacao" rows="3" maxlength="1000"
                              placeholder="Estado dos equipamentos, acessórios que vieram junto"></textarea>
                </div>
            </section>

            <div class="acoes-form">
                <a class="btn btn-secundario" th:href="@{/painel/manutencoes}">Cancelar</a>
                <button type="button" class="btn btn-primario" id="salvar">Salvar ordem</button>
            </div>
        </div>
    </main>
</div>

<script>
    const tabela = document.getElementById('itens');
    const opcoes = document.getElementById('opcoesProduto').innerHTML;
    let alterado = false;

    function campo(id) {
        return document.getElementById(id);
    }

    function texto(id) {
        const valor = campo(id).value.trim();
        return valor === '' ? null : valor;
    }

    function lerCookie(nome) {
        const item = document.cookie.split('; ').find(c => c.startsWith(nome + '='));
        return item ? decodeURIComponent(item.split('=')[1]) : null;
    }

    function atualizarRemover() {
        const linhas = tabela.querySelectorAll('tr');
        linhas.forEach(linha => linha.querySelector('.remover').disabled = linhas.length === 1);
    }

    function adicionarItem() {
        const linha = document.createElement('tr');
        linha.innerHTML = `
            <td><select class="in produto">${opcoes}</select></td>
            <td><input class="in codigo mono" placeholder="Ex.: CHD-80-300"></td>
            <td><input class="in quantidade" type="number" min="1" value="1"></td>
            <td><button type="button" class="remover" aria-label="Remover equipamento">✕</button></td>
        `;
        tabela.appendChild(linha);
        atualizarRemover();
        return linha;
    }

    function montarOrdem() {
        return {
            empresa: texto('empresa'),
            comprador: texto('comprador'),
            telefone: texto('telefone'),
            email: texto('email'),
            itens: [...tabela.querySelectorAll('tr')].map(linha => ({
                produto: linha.querySelector('.produto').value,
                codigo: linha.querySelector('.codigo').value.trim() || null,
                quantidade: Number(linha.querySelector('.quantidade').value) || null
            })),
            problemaRelatado: texto('problemaRelatado'),
            observacao: texto('observacao')
        };
    }

    function mostrarErros(resposta) {
        const mensagens = resposta.campos ? Object.values(resposta.campos) : [resposta.mensagem];
        const caixa = campo('erros');
        caixa.innerHTML = '<strong>Corrija antes de salvar:</strong>';
        [...new Set(mensagens)].forEach(m => {
            const linha = document.createElement('div');
            linha.textContent = m;
            caixa.appendChild(linha);
        });
        caixa.classList.remove('escondido');
        campo('sucesso').classList.add('escondido');
        window.scrollTo(0, 0);
    }

    function mostrarSucesso(id) {
        const caixa = campo('sucesso');
        caixa.innerHTML = `<span>Ordem <strong>#${id}</strong> salva.</span><a href="/manutencoes/${id}/pdf" target="_blank">Abrir PDF</a>`;
        caixa.classList.remove('escondido');
        campo('erros').classList.add('escondido');
        window.scrollTo(0, 0);
    }

    function limparFormulario() {
        ['empresa', 'comprador', 'telefone', 'email', 'problemaRelatado', 'observacao']
            .forEach(id => campo(id).value = '');
        tabela.innerHTML = '';
        adicionarItem();
        document.querySelectorAll('.contador').forEach(c => c.dispatchEvent(new Event('atualizar')));
    }

    async function salvar() {
        const botao = campo('salvar');
        botao.disabled = true;

        try {
            const resposta = await fetch('/manutencoes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-XSRF-TOKEN': lerCookie('XSRF-TOKEN')
                },
                body: JSON.stringify(montarOrdem())
            });

            if (resposta.status === 403) {
                mostrarErros({ mensagem: 'Sessão expirada. Faça login de novo.' });
                return;
            }

            const corpo = await resposta.json();

            if (resposta.ok) {
                alterado = false;
                limparFormulario();
                mostrarSucesso(corpo.id);
            } else {
                mostrarErros(corpo);
            }
        } finally {
            botao.disabled = false;
        }
    }

    document.querySelectorAll('.contador').forEach(contador => {
        const caixa = campo(contador.dataset.de);
        const atualizar = () => contador.textContent = caixa.value.length + ' / 1000';
        caixa.addEventListener('input', atualizar);
        contador.addEventListener('atualizar', atualizar);
        atualizar();
    });

    tabela.addEventListener('click', evento => {
        if (evento.target.classList.contains('remover')) {
            evento.target.closest('tr').remove();
            atualizarRemover();
        }
    });
    campo('adicionar').addEventListener('click', () => adicionarItem().querySelector('.produto').focus());
    campo('salvar').addEventListener('click', salvar);
    campo('ficha').addEventListener('input', () => alterado = true);

    window.addEventListener('beforeunload', evento => {
        if (alterado) {
            evento.preventDefault();
            evento.returnValue = '';
        }
    });

    adicionarItem();
</script>

</body>
</html>
