<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cota | Nova manutenção</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f5f7; color: #222; }
        header { background: #1f2937; color: #fff; padding: 16px 24px; }
        header h1 { margin: 0; font-size: 22px; }
        main { max-width: 800px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 24px; }
        .linha { display: flex; gap: 16px; }
        .campo { flex: 1; margin-bottom: 14px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        textarea { height: 80px; resize: vertical; }
        .erros { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
        .botoes { display: flex; gap: 10px; }
        .botao { padding: 10px 18px; background: #1f2937; color: #fff; border: none; border-radius: 6px;
            font-size: 14px; cursor: pointer; text-decoration: none; }
        .botao.secundario { background: #6b7280; }
    </style>
</head>
<body>

<header>
    <h1>Cota</h1>
</header>

<main>
    <h2>Ordem de Manutenção</h2>

    <div class="card">

        <!-- Mensagens de erro (só aparece se tiver) -->
        <div class="erros" th:if="${erros != null}">
            <div th:each="erro : ${erros}" th:text="${erro}">Erro</div>
        </div>

        <form method="post" th:action="@{/painel/manutencoes}">

            <div class="linha">
                <div class="campo">
                    <label for="cliente">Nome do cliente</label>
                    <input id="cliente" name="cliente" required
                           th:value="${form?.cliente()}">
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" name="telefone" required
                           th:value="${form?.telefone()}">
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="produto">Produto</label>
                    <select id="produto" name="produto">
                        <option th:each="p : ${produtos}"
                                th:value="${p}"
                                th:text="${p}"
                                th:selected="${form != null and form.produto() == p}">CILINDRO</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="codigoProduto">Código do produto</label>
                    <input id="codigoProduto" name="codigoProduto"
                           th:value="${form?.codigoProduto()}">
                </div>
            </div>

            <div class="campo">
                <label for="problemaRelatado">Problema relatado</label>
                <textarea id="problemaRelatado" name="problemaRelatado" required
                          th:text="${form?.problemaRelatado()}"></textarea>
            </div>

            <div class="campo">
                <label for="observacao">Observações</label>
                <textarea id="observacao" name="observacao"
                          th:text="${form?.observacao()}"></textarea>
            </div>

            <div class="botoes">
                <button type="submit" class="botao">Gerar PDF</button>
                <a class="botao secundario" th:href="@{/painel}">Voltar</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
