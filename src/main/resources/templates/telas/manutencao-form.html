<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cota | Nova manutenção</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cota.css}">
    <style>
        .migalha { font-size: 13px; color: #5B6474; }
        .migalha a { color: #5B6474; text-decoration: none; }
        .migalha a:hover { color: #0E1726; }

        .formulario { max-width: 880px; display: flex; flex-direction: column; gap: 20px; }
        .card h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
        .linha { display: flex; flex-wrap: wrap; gap: 16px; }
        .linha .campo { flex: 1 1 220px; }
        .bloco + .bloco { margin-top: 16px; }
        .opcional { font-weight: 400; color: #5B6474; }
        .lbl-linha { display: flex; justify-content: space-between; }
        .contador { font-size: 12px; color: #5B6474; font-variant-numeric: tabular-nums; }
        .codigo { max-width: 280px; font-family: 'Geist Mono', monospace; }

        .produtos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .produto input { position: absolute; opacity: 0; pointer-events: none; }
        .produto span { display: flex; align-items: center; min-height: 52px; padding: 0 14px; border-radius: 10px; border: 1px solid #E4E7EC; background: #FFFFFF; font-size: 14px; font-weight: 500; cursor: pointer; }
        .produto span:hover { border-color: #98A2B3; }
        .produto input:checked + span { border-color: #0E1726; box-shadow: 0 0 0 1px #0E1726; background: #F5F7FB; }
        .produto input:focus-visible + span { outline: 2px solid #2B5BD7; outline-offset: 2px; }

        .alerta-ok { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
        .alerta-ok a { color: #067647; font-weight: 600; }
        .acoes-form { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

<div class="app">
    <aside th:replace="~{fragments/sidebar :: sidebar('nova-manutencao')}"></aside>

    <main class="conteudo">
        <div>
            <div class="migalha">
                <a th:href="@{/painel/manutencoes}">Ordens de manutenção</a> / Nova
            </div>
            <h1 style="margin-top: 8px;">Nova ordem de manutenção</h1>
            <p class="subtitulo">Depois de salvar, é só abrir o PDF com as 2 vias.</p>
        </div>

        <div class="alerta-ok formulario" th:if="${param.salva}">
            <span th:text="'Ordem #' + ${param.salva} + ' salva.'">Ordem #1 salva.</span>
            <a th:href="@{/manutencoes/{id}/pdf(id=${param.salva})}" target="_blank">Abrir PDF</a>
        </div>

        <div class="alerta-erro formulario" th:if="${erros != null}">
            <strong>Corrija antes de salvar:</strong>
            <div th:each="erro : ${erros}" th:text="${erro}">Erro</div>
        </div>

        <form class="formulario" method="post" th:action="@{/painel/manutencoes}">

            <section class="card">
                <h2>Cliente</h2>
                <div class="linha">
                    <div class="campo">
                        <label class="lbl" for="cliente">Nome do cliente</label>
                        <input class="in" id="cliente" name="cliente" placeholder="Empresa ou pessoa"
                               th:value="${form?.cliente()}">
                    </div>
                    <div class="campo">
                        <label class="lbl" for="telefone">Telefone</label>
                        <input class="in" id="telefone" name="telefone" type="tel" placeholder="(11) 90000-0000"
                               th:value="${form?.telefone()}">
                    </div>
                </div>
            </section>

            <section class="card">
                <h2>Equipamento</h2>

                <div class="campo bloco">
                    <span class="lbl">Produto</span>
                    <div class="produtos">
                        <label class="produto" th:each="p : ${produtos}">
                            <input type="radio" name="produto" th:value="${p}"
                                   th:checked="${form != null} ? ${form.produto() == p} : ${p.name() == 'CILINDRO'}">
                            <span th:text="${p.nome}">Cilindro</span>
                        </label>
                    </div>
                </div>

                <div class="campo bloco">
                    <label class="lbl" for="codigoProduto">Código do produto <span class="opcional">(opcional)</span></label>
                    <input class="in codigo" id="codigoProduto" name="codigoProduto" placeholder="Ex.: CHD-80-300"
                           th:value="${form?.codigoProduto()}">
                </div>

                <div class="campo bloco">
                    <div class="lbl-linha">
                        <label class="lbl" for="problemaRelatado">Problema relatado</label>
                        <span class="contador" data-de="problemaRelatado">0 / 1000</span>
                    </div>
                    <textarea class="in" id="problemaRelatado" name="problemaRelatado" rows="4" maxlength="1000"
                              placeholder="O que o cliente disse que está acontecendo"
                              th:text="${form?.problemaRelatado()}"></textarea>
                </div>

                <div class="campo bloco">
                    <div class="lbl-linha">
                        <label class="lbl" for="observacao">Observação <span class="opcional">(opcional)</span></label>
                        <span class="contador" data-de="observacao">0 / 1000</span>
                    </div>
                    <textarea class="in" id="observacao" name="observacao" rows="3" maxlength="1000"
                              placeholder="Estado do equipamento, acessórios que vieram junto"
                              th:text="${form?.observacao()}"></textarea>
                </div>
            </section>

            <div class="acoes-form">
                <a class="btn btn-secundario" th:href="@{/painel/manutencoes}">Cancelar</a>
                <button type="submit" class="btn btn-primario">Salvar ordem</button>
            </div>
        </form>
    </main>
</div>

<script>
    document.querySelectorAll('.contador').forEach(contador => {
        const campo = document.getElementById(contador.dataset.de);
        const atualizar = () => contador.textContent = campo.value.length + ' / 1000';
        campo.addEventListener('input', atualizar);
        atualizar();
    });
</script>

</body>
</html>
